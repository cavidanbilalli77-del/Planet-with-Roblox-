<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uzay Oyunu</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070816;--vio:#6c4cff;--cy:#4de1ff;--or:#ffb454;--tx:#e9ecff;--pn:rgba(20,22,52,.82);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Rubik,system-ui,sans-serif;overflow:hidden;touch-action:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
canvas{position:fixed;inset:0;width:100%;height:100%}
.screen{position:fixed;inset:0;overflow-y:auto;padding:max(env(safe-area-inset-top,0px),18px) 14px 24px;touch-action:pan-y;transition:opacity .5s}
.hidden{display:none!important}
h1{font-weight:800;font-size:clamp(26px,7vw,44px);margin:6px 0 2px;text-align:center;letter-spacing:.5px}
.sub{text-align:center;opacity:.7;margin:0 0 16px;font-size:14px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;max-width:760px;margin:0 auto}
.card{background:var(--pn);border:2px solid #2b2f66;border-radius:14px;padding:12px 6px 10px;text-align:center;cursor:pointer;color:inherit;font:inherit;transition:transform .2s,border-color .2s}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--cy);outline:none}
.card svg{height:110px;width:auto;display:block;margin:0 auto 6px}
.card b{font-weight:600;font-size:15px}
.card.plus{border-style:dashed;border-color:var(--or);display:flex;flex-direction:column;align-items:center;justify-content:center}
.card.plus i{font-style:normal;font-size:54px;line-height:110px;color:var(--or)}
.card.pick{transform:scale(1.15);border-color:var(--or);z-index:3}
#grid.go .card:not(.pick){opacity:0;transform:scale(.8);transition:all .4s}
#cus{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:30px}
#cus svg{height:170px;width:auto}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.row label{display:flex;flex-direction:column;align-items:center;font-size:13px;gap:4px}
input[type=color]{width:56px;height:40px;border:2px solid #2b2f66;border-radius:8px;background:none;padding:2px}
input[type=text],input[type=password]{background:var(--pn);border:2px solid #2b2f66;border-radius:10px;color:var(--tx);font:inherit;padding:10px 12px;width:min(260px,80vw);text-align:center}
#abox{display:flex;flex-direction:column;gap:10px;width:min(340px,100%);margin:10px auto 0}#abox input{width:100%}#abox small{text-align:center;opacity:.6;font-size:12px}.tabs{display:flex;gap:8px}.tabs .btn{flex:1;padding:10px 6px}#aerr{min-height:20px;color:#ff8a8a;font-size:13px;text-align:center}#acct{display:flex;justify-content:space-between;align-items:center;max-width:760px;margin:0 auto 4px}#acct span{background:var(--pn);padding:7px 12px;border-radius:10px;font-size:14px}#acct .btn{padding:7px 12px;font-size:13px}
#hd{position:fixed;right:10px;top:calc(max(env(safe-area-inset-top,0px),10px) + 46px);z-index:4;padding:7px 14px;font-size:14px;background:#ffb454;color:#1a1200;letter-spacing:1px}
#act{position:fixed;right:14px;bottom:calc(max(env(safe-area-inset-bottom,0px),10px) + 74px);z-index:4;width:68px;height:68px;border-radius:50%;border:3px solid #ffb454;background:rgba(20,22,52,.85);font-size:30px;color:#fff}
#act:active{transform:scale(.92)}
#hdp{position:fixed;left:10px;right:10px;bottom:calc(max(env(safe-area-inset-bottom,0px),10px) + 70px);max-height:55vh;overflow-y:auto;z-index:8;background:rgba(14,16,40,.96);border:2px solid #ffb454;border-radius:14px;padding:12px;touch-action:pan-y}
#hdp .hh{display:flex;justify-content:space-between;align-items:center}#hdp h4{margin:10px 0 6px;font-size:13px;opacity:.7;font-weight:600}#hdp .opt{display:flex;flex-wrap:wrap;gap:6px}
#hdp button{background:#262a63;color:#fff;border:1px solid #3a3f86;border-radius:9px;padding:8px 11px;font:500 14px Rubik,system-ui,sans-serif}#hdp button.on{background:#ffb454;color:#1a1200}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#fff;color:#10122c;padding:9px 14px;border-radius:10px;z-index:9;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center;font-size:14px}#toast.on{opacity:1}
#flash2{position:fixed;inset:0;background:radial-gradient(circle,#4de1ff88,#4de1ff00 70%);opacity:0;pointer-events:none;z-index:6}#flash2.on{animation:fl2 .6s ease-out}@keyframes fl2{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.lg{display:flex;gap:4px}.lg button{background:var(--pn);color:var(--tx);border:2px solid #2b2f66;border-radius:8px;padding:4px 8px;font:600 12px Rubik,system-ui,sans-serif}.lg button.on{border-color:var(--cy);color:var(--cy)}
.sh{display:flex;gap:8px;align-items:center;font-size:13px;opacity:.85}
button.btn{background:var(--vio);color:#fff;border:0;border-radius:12px;padding:12px 22px;font:600 16px Rubik,system-ui,sans-serif;cursor:pointer}
button.ghost{background:transparent;border:2px solid #2b2f66;color:var(--tx)}
#fly{position:fixed;left:50%;top:50%;margin:-90px 0 0 -54px;height:180px;z-index:5;pointer-events:none;display:none}
#fly svg{height:180px;width:auto}
#fly.on{display:block;animation:fly 2.6s cubic-bezier(.5,0,.9,.4) forwards}
@keyframes fly{0%{transform:scale(1.5) translateY(0) rotate(0)}25%{transform:scale(1.2) translateY(14vh) rotate(-6deg)}100%{transform:scale(.08) translateY(-95vh) rotate(40deg);opacity:0}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
#flash.on{animation:fl 1s ease-out}
@keyframes fl{0%{opacity:0}18%{opacity:.85}100%{opacity:0}}
#msg{position:fixed;left:0;right:0;top:42%;text-align:center;font-weight:800;font-size:24px;z-index:5;opacity:0;pointer-events:none;letter-spacing:2px}
#msg.on{animation:mg 2.6s}
@keyframes mg{0%,15%{opacity:0}35%,75%{opacity:1}100%{opacity:0}}
#hud{position:fixed;left:0;right:0;bottom:0;padding:8px 10px max(env(safe-area-inset-bottom,0px),10px);z-index:4;pointer-events:none}
#top{position:fixed;left:10px;right:10px;top:max(env(safe-area-inset-top,0px),10px);display:flex;justify-content:space-between;align-items:center;z-index:4;font-size:13px}
#top span{background:var(--pn);padding:6px 10px;border-radius:10px;white-space:nowrap}
#top button{pointer-events:auto;padding:7px 12px;font-size:13px}
#log{max-width:520px;display:flex;flex-direction:column;gap:3px;margin-bottom:8px;font-size:14px}
#log div{background:rgba(7,8,22,.7);padding:4px 9px;border-radius:9px;width:fit-content;max-width:100%;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
#log b{font-weight:600}
#cr{display:flex;gap:8px;max-width:520px;pointer-events:auto}
#cr input{flex:1;background:var(--pn);border:2px solid #2b2f66;border-radius:12px;color:var(--tx);font:inherit;font-size:16px;padding:10px 12px;min-width:0}
#cr input:focus{outline:none;border-color:var(--cy)}
@media (prefers-reduced-motion:reduce){#fly.on{animation-duration:1s}.card{transition:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="auth" class="screen">
  <div class="lg" style="justify-content:center;margin-bottom:6px"></div>
  <h1>Uzay Oyunu 🚀</h1>
  <p class="sub">Hesabınla daxil ol və ya yeni hesab qur</p>
  <div id="abox">
    <div class="tabs"><button class="btn" id="tl">Daxil ol</button><button class="btn ghost" id="tr">Hesab qur</button></div>
    <input type="text" id="au" placeholder="İstifadəçi adı" maxlength="20" autocomplete="username" autocapitalize="off" spellcheck="false">
    <input type="password" id="ap" placeholder="Şifrə" autocomplete="current-password">
    <input type="password" id="ap2" class="hidden" placeholder="Şifrəni təkrar yaz" autocomplete="new-password">
    <label class="sh"><input type="checkbox" id="sp"><span id="spt"></span></label>
    <div id="aerr"></div>
    <button class="btn" id="asub">Daxil ol</button>
    <button class="btn ghost" id="aguest">Qonaq kimi davam et</button>
    <small>Hesab yalnız bu cihazda saxlanılır.</small>
  </div>
</div>

<div id="sel" class="screen hidden">
  <div id="acct"><span id="acn"></span><div class="lg"></div><button class="btn ghost" id="acx"></button></div>
  <h1>Xarakterini seç</h1>
  <p class="sub">Birini seç — uzaya atılırsan 🚀</p>
  <div id="grid"></div>
</div>

<div id="cus" class="screen hidden">
  <h1>Özünü qur</h1>
  <div id="prev"></div>
  <input type="text" id="cn" maxlength="20" placeholder="Adın" value="Cavidan">
  <div class="row">
    <label>Baş<input type="color" id="c1" value="#f5cd30"></label>
    <label>Gövdə<input type="color" id="c2" value="#6c4cff"></label>
    <label>Ayaqlar<input type="color" id="c3" value="#2a2a3c"></label>
    <label>Gözlər<input type="color" id="c4" value="#111111"></label>
  </div>
  <div class="row">
    <button class="btn ghost" id="back">Geri</button>
    <button class="btn" id="go">Uzaya başla</button>
  </div>
</div>

<button class="btn hidden" id="hd">HD</button><button class="hidden" id="act"></button>
<div id="hdp" class="hidden"><div class="hh"><b id="hdt"></b><button id="hdx">×</button></div><div id="hdc"></div></div>
<div id="toast"></div><div id="flash2"></div>
<div id="fly"></div><div id="flash"></div><div id="msg">UZAYA UÇURUQ…</div>

<div id="top" class="hidden"><span id="who"></span><span id="hint">Toxun və sürüklə</span><button class="btn ghost" id="menu">Menyu</button></div>
<div id="hud" class="hidden">
  <div id="log"></div>
  <div id="cr"><input id="ci" maxlength="80" placeholder="Mesaj yaz…" autocomplete="off"><button class="btn" id="cs">Göndər</button></div>
</div>

<script>
const $=s=>document.querySelector(s);
const CH=[
{n:'Noob',h:'#f5cd30',t:'#0d69ac',l:'#a2c429',a:'#f5cd30',e:'#111'},
{n:'Bacon',h:'#f5cd30',t:'#3b6fd4',l:'#4b974b',a:'#f5cd30',e:'#111',hair:'#6b3f1d'},
{n:'1x1x1x1',h:'#1b1b1b',t:'#0c0c0c',l:'#141414',a:'#1b1b1b',e:'#35ff6a'},
{n:'c00lkidd',h:'#d9a066',t:'#151515',l:'#7a0000',a:'#d9a066',e:'#c00',hair:'#222'},
{n:'guest666',h:'#3d3d3d',t:'#1a1a1a',l:'#242424',a:'#3d3d3d',e:'#ff2a2a'},
{n:'Inco4mu1',h:'#9d7bff',t:'#2a1b5e',l:'#1d1d3a',a:'#9d7bff',e:'#fff'},
{n:'tubers93',h:'#f5cd30',t:'#ff8a1f',l:'#f2f2f2',a:'#ff8a1f',e:'#111'}
];
function av(c){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 100" width="60" height="100"><g stroke="#0006" stroke-width="1"><rect x="14" y="58" width="16" height="36" fill="${c.l}"/><rect x="30" y="58" width="16" height="36" fill="${c.l}"/><rect x="14" y="24" width="32" height="34" fill="${c.t}"/><rect x="4" y="24" width="10" height="34" fill="${c.a}"/><rect x="46" y="24" width="10" height="34" fill="${c.a}"/><rect x="19" y="2" width="22" height="22" rx="4" fill="${c.h}"/>${c.hair?`<rect x="18" y="0" width="24" height="8" rx="3" fill="${c.hair}"/>`:''}</g><rect x="25" y="11" width="3.5" height="5" fill="${c.e}"/><rect x="32" y="11" width="3.5" height="5" fill="${c.e}"/><rect x="26" y="18" width="8" height="1.5" fill="${c.e}"/></svg>`}
function img(c){const i=new Image();i.src='data:image/svg+xml;utf8,'+encodeURIComponent(av(c));return i}

// ---- menu
const grid=$('#grid');
CH.forEach(c=>{const b=document.createElement('button');b.className='card';b.innerHTML=av(c)+`<b>${c.n}</b>`;b.onclick=()=>launch(c,b);grid.appendChild(b)});
const pl=document.createElement('button');pl.className='card plus';pl.innerHTML='<i>+</i><b>Özün qur</b>';pl.onclick=()=>{$('#sel').classList.add('hidden');$('#cus').classList.remove('hidden');if(ACC&&ACC.custom){const k=ACC.custom;$('#cn').value=k.n;$('#c1').value=k.h;$('#c2').value=k.t;$('#c3').value=k.l;$('#c4').value=k.e}else $('#cn').value=ACC?ACC.u:'Oyunçu';upd()};grid.appendChild(pl);
function cur(){return{n:($('#cn').value||'Mən').trim(),h:$('#c1').value,t:$('#c2').value,l:$('#c3').value,a:$('#c1').value,e:$('#c4').value}}
function upd(){$('#prev').innerHTML=av(cur())}
['c1','c2','c3','c4'].forEach(i=>$('#'+i).oninput=upd);
$('#back').onclick=()=>{$('#cus').classList.add('hidden');$('#sel').classList.remove('hidden')};
$('#go').onclick=()=>{const c=cur();if(c.n.length<3||c.n.length>20)return toast(t('nLen'));$('#cus').classList.add('hidden');if(launch(c,null)===false)$('#cus').classList.remove('hidden')};

// ---- canvas
const cv=$('#cv'),g=cv.getContext('2d');let W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
const ps=[...Array(160)].map(()=>({x:Math.random()*2400,y:Math.random()*2400,d:.1+Math.random()*.5,r:Math.random()*1.5+.4}));
const ws=[...Array(260)].map(()=>({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()}));
const PL=[
{n:'Mars',x:420,y:-240,r:80,a:'#ff8a5c',b:'#8c2f1b'},
{n:'Saturn',x:-650,y:330,r:120,a:'#f7dc9a',b:'#9c7a3c',ring:1},
{n:'Neptun',x:900,y:520,r:65,a:'#7fb8ff',b:'#1f3fa0'},
{n:'Yer',x:-320,y:-640,r:55,a:'#6fe0a0',b:'#1b4fa8'},
{n:'Yupiter',x:1300,y:-500,r:150,a:'#f0c9a0',b:'#a0602f'}
];
let mode='idle',t0=0,me=null,bots=[],keys={},ptr={d:0,x:0,y:0};
function drawStars(cx,cy,al){g.fillStyle='#fff';for(const s of ps){const x=((s.x-cx*s.d)%W+W)%W,y=((s.y-cy*s.d)%H+H)%H;g.globalAlpha=al*(.4+s.d)*(.7+.3*Math.sin(performance.now()*.003+s.x));g.fillRect(x,y,s.r,s.r)}g.globalAlpha=1}
function planet(p,cx,cy){const x=p.x-cx+W/2,y=p.y-cy+H/2;if(x<-300||x>W+300||y<-300||y>H+300)return;
 if(p.ring){g.save();g.translate(x,y);g.rotate(-.35);g.strokeStyle='rgba(247,220,154,.55)';g.lineWidth=14;g.beginPath();g.ellipse(0,0,p.r*1.8,p.r*.5,0,Math.PI,2*Math.PI);g.stroke();g.restore()}
 const gl=g.createRadialGradient(x,y,p.r*.9,x,y,p.r*1.4);gl.addColorStop(0,p.a+'55');gl.addColorStop(1,p.a+'00');g.fillStyle=gl;g.beginPath();g.arc(x,y,p.r*1.4,0,7);g.fill();const gr=g.createRadialGradient(x-p.r*.35,y-p.r*.35,p.r*.1,x,y,p.r);gr.addColorStop(0,p.a);gr.addColorStop(1,p.b);g.fillStyle=gr;g.beginPath();g.arc(x,y,p.r,0,7);g.fill();
 if(p.ring){g.save();g.translate(x,y);g.rotate(-.35);g.strokeStyle='rgba(247,220,154,.55)';g.lineWidth=14;g.beginPath();g.ellipse(0,0,p.r*1.8,p.r*.5,0,0,Math.PI);g.stroke();g.restore()}
 g.fillStyle='#e9ecff';g.font='600 13px Rubik,system-ui';g.textAlign='center';g.globalAlpha=.8;g.fillText(t('p_'+p.n),x,y+p.r+18);g.globalAlpha=1}
function ent(e,now){const bob=Math.sin(now/500+e.ph)*5;g.save();g.translate(e.x-me.x+W/2,e.y-me.y+H/2+bob);g.rotate(Math.max(-.5,Math.min(.5,e.vx*.05)));
 if(e.im.complete)g.drawImage(e.im,-27,-45,54,90);const tl=e===me?tool:e.tl;if(tl){g.font='22px sans-serif';g.textAlign='center';g.fillText(tl==='gun'?'🔫':'🔨',26,8)}g.restore();
 const sx=e.x-me.x+W/2,sy=e.y-me.y+H/2+bob;g.textAlign='center';g.font='600 12px Rubik,system-ui';g.fillStyle='#e9ecff';const up=16,nm=e.u||e.n,nw=g.measureText(nm).width,sh=e.admin?8.5:0;g.fillText(nm,sx-sh,sy-56-up);
 if(e.admin){g.font='800 12px Rubik,system-ui';g.textAlign='left';g.lineJoin='round';const L=[...'ADMIN'],ws=L.map(c=>g.measureText(c).width+1.2),aw=ws.reduce((a,b)=>a+b,0),x0=sx-aw/2;let x=x0;
  L.forEach((c,k)=>{g.strokeStyle='rgba(0,0,0,.65)';g.lineWidth=2.6;g.strokeText(c,x,sy-56);g.fillStyle='hsl('+((k*68+now/5)%360)+',95%,62%)';g.fillText(c,x,sy-56);x+=ws[k]});
  const bx2=sx-sh+nw/2+11,by=sy-60-up;g.save();g.translate(bx2,by);g.rotate(.26);g.fillStyle='#1d9bf0';g.beginPath();g.roundRect(-6.5,-6.5,13,13,3);g.fill();
  g.strokeStyle='#fff';g.lineWidth=1.8;g.lineCap='round';g.beginPath();g.moveTo(-3.2,.2);g.lineTo(-.9,2.6);g.lineTo(3.3,-2.6);g.stroke();g.restore();g.textAlign='center'}
 if(!e.admin){const k=e.ch?'BOT':e.guest?t('tagG'):'People';g.font='600 11px Rubik,system-ui';g.textAlign='center';g.fillStyle=e.ch?'#9fb0ff':e.guest?'#ffd36b':'#7dff9b';g.strokeStyle='rgba(0,0,0,.6)';g.lineWidth=2.4;g.lineJoin='round';g.strokeText(k,sx,sy-56);g.fillText(k,sx,sy-56)}
 if(e.bt>now){g.font='14px Rubik,system-ui';const w=Math.min(220,g.measureText(e.bx).width+18);const bx=Math.max(w/2+6,Math.min(W-w/2-6,sx));g.fillStyle='#fff';g.beginPath();g.roundRect(bx-w/2,sy-92-up,w,26,9);g.fill();g.fillStyle='#10122c';g.fillText(e.bx.length>30?e.bx.slice(0,29)+'…':e.bx,bx,sy-74-up)}}
function loop(now){requestAnimationFrame(loop);g.clearRect(0,0,W,H);g.fillStyle='#070816';g.fillRect(0,0,W,H);
 const gl=g.createRadialGradient(W*.7,H*.3,10,W*.7,H*.3,Math.max(W,H)*.7);gl.addColorStop(0,'rgba(108,76,255,.22)');gl.addColorStop(1,'rgba(7,8,22,0)');g.fillStyle=gl;g.fillRect(0,0,W,H);
 if(mode==='idle'){drawStars(now*.02,now*.01,1);return}
 if(mode==='warp'){const t=(now-t0)/1000;const v=t<2?.004+t*.03:Math.max(.004,.064-(t-2)*.1);
  g.strokeStyle='#cfe4ff';for(const s of ws){const z0=s.z+v*3;s.z-=v;if(s.z<=.01){s.x=Math.random()*2-1;s.y=Math.random()*2-1;s.z=1;continue}
   const x1=W/2+s.x/s.z*W/2,y1=H/2+s.y/s.z*H/2,x0=W/2+s.x/z0*W/2,y0=H/2+s.y/z0*H/2;g.globalAlpha=Math.min(1,(1-s.z)*1.6);g.lineWidth=1+(1-s.z)*1.6;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke()}g.globalAlpha=1;
  if(t>2.7){mode='space';begin()}return}
 // space
 let ax=0,ay=0;if(keys.ArrowLeft||keys.a)ax--;if(keys.ArrowRight||keys.d)ax++;if(keys.ArrowUp||keys.w)ay--;if(keys.ArrowDown||keys.s)ay++;
 if(ptr.d){const dx=ptr.x-W/2,dy=ptr.y-H/2,m=Math.hypot(dx,dy);if(m>24){ax=dx/m;ay=dy/m}}
 if(me.dead>now){ax=ay=0}me.vx=(me.vx+ax*.22)*.965;me.vy=(me.vy+ay*.22)*.965;me.x+=me.vx;me.y+=me.vy;
 drawStars(me.x,me.y,1);PL.forEach(p=>planet(p,me.x,me.y));
 if(Math.random()<.012)SS.push({x:Math.random()*W,y:Math.random()*H*.5,vx:-9-Math.random()*6,vy:5+Math.random()*4,l:28});
 for(let k=SS.length-1;k>=0;k--){const q=SS[k];q.x+=q.vx;q.y+=q.vy;if(--q.l<=0){SS.splice(k,1);continue}g.strokeStyle='#fff';g.globalAlpha=q.l/28;g.lineWidth=2;g.beginPath();g.moveTo(q.x,q.y);g.lineTo(q.x-q.vx*3,q.y-q.vy*3);g.stroke();g.globalAlpha=1}
